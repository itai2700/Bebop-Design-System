<!doctype html>
<html><head><meta charset="utf-8"/>
<title>Spelling lock</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: "Archivo", sans-serif; color: #0A0E10; }
  h2 { font-family: "Archivo Black", sans-serif; font-weight: 400; font-size: 14px; letter-spacing: -0.015em; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .item { border: 1px solid rgba(0,0,0,0.10); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
  .text { font-family: "Archivo Black", sans-serif; font-weight: 400; font-size: 20px; letter-spacing: -0.02em; line-height: 1; }
  .badge { font-size: 9px; padding: 4px 8px; border-radius: 999px; font-weight: 700; letter-spacing: 0.08em; }
  .ok { background: #E0FF4F; color: #0A0E10; }
  .no { background: rgba(178, 58, 58, 0.10); color: #B23A3A; }
  .item.bad .text { color: #B23A3A; text-decoration: line-through; text-decoration-thickness: 2px; }
  .item.good .text { color: #0A0E10; }
</style></head>
<body>
  <h2>Always Bebop. With the period.</h2>
  <div class="grid">
    <div class="item good"><span class="text">Bebop.</span><span class="badge ok">CORRECT</span></div>
    <div class="item bad"><span class="text">BeBop</span><span class="badge no">NO</span></div>
    <div class="item bad"><span class="text">BEBOP</span><span class="badge no">NO</span></div>
    <div class="item bad"><span class="text">bebop</span><span class="badge no">NO</span></div>
    <div class="item bad"><span class="text">Be-Bop</span><span class="badge no">NO</span></div>
    <div class="item bad"><span class="text" style="font-size:16px">Bebop (no period)</span><span class="badge no">NO</span></div>
  </div>
</body></html>
