<!doctype html>
<html><head><meta charset="utf-8"/>
<title>Wordmark modes</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: "Archivo", sans-serif; color: #0A0E10; }
  h2 { font-family: "Archivo Black", sans-serif; font-weight: 400; font-size: 14px; letter-spacing: -0.015em; margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { border-radius: 12px; overflow: hidden; border: 1px solid rgba(0,0,0,0.06); }
  .stage { padding: 38px 28px; display: flex; align-items: center; justify-content: center; }
  .a .stage { background: #F2F0E8; }
  .b .stage { background: #0A0E10; }
  .label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(0,0,0,0.55); padding: 12px 16px 14px; background: #fff; border-top: 1px solid rgba(0,0,0,0.06); }
  .label b { display: block; font-family: "Archivo Black", sans-serif; font-weight: 400; font-size: 13px; color: #0A0E10; letter-spacing: -0.01em; margin-bottom: 2px; }

  .bb { display: inline-flex; align-items: baseline; line-height: 1; }
  .wm { font-family: "Archivo Black", sans-serif; font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: -1.5px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; margin-left: 3px; transform: translateY(2px); display: inline-block; }
  .a .wm { color: #0A0E10; } .a .dot { background: #E0FF4F; }
  .b .wm { color: #F2F0E8; } .b .dot { background: #FF3D8B; }
</style></head>
<body>
  <h2>Two official lockups — A · Primary · B · Reversed</h2>
  <div class="grid">
    <div class="card a">
      <div class="stage"><span class="bb"><span class="wm">Bebop</span><span class="dot"></span></span></div>
      <div class="label"><b>A · Primary</b>Ink on Paper · Lime dot</div>
    </div>
    <div class="card b">
      <div class="stage"><span class="bb"><span class="wm">Bebop</span><span class="dot"></span></span></div>
      <div class="label"><b>B · Reversed</b>Paper on Ink · Magenta dot</div>
    </div>
  </div>
</body></html>
